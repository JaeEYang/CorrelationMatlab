[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "correlation-2d-3d"
version = "0.1.0"
description = "Napari plugin for Correlation 2D-3D: Offline Correlation and SerialEM Integration"
authors = [
  { name = "Author Name", email = "author@example.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "napari",
  "numpy",
  "scipy",
  "scikit-image",
  "mrcfile",
  "magicgui",
  "qtpy",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"correlation2d3d" = ["napari.yaml"]

[project.entry-points."napari.manifest"]
correlation-2d-3d = "correlation2d3d:napari.yaml"
